# haproxy-approot.cfg - porta 1234 das stacks da fonte reserva (servico approot).
# O HAProxy divide a porta multiprotocolo do lab entre dois servidores do AppServer, que roda na rede
# deste container (network_mode service:approot no compose):
#   - HTTP com caminho /app-root  -> HTTPSERVER do /app-root na 9995 (tela de login da interface nova),
#                                    ou o AppServer na 1235 quando a 9995 esta desligada (/app-root
#                                    nativo, usado na 2610 depois do plab inicializar)
#   - HTTP com outro caminho      -> AppServer na 1235 (WebApp, websocket, REST do multiprotocolo)
#   - qualquer outro protocolo    -> AppServer na 1235 (SmartClient/TDS/advpls)
# Substitui o app-root-proxy da imagem 2610 do autor, que deixava conexoes presas em CLOSE_WAIT (um
# processo por conexao que nunca terminava) e degradava o AppServer depois de umas 25 sessoes (06/11/2026).
global
    log stdout format raw local0 notice

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 30s
    timeout http-keep-alive 15s

frontend multiprotocolo
    bind :1234
    mode tcp
    # Registra so as conexoes com erro (ex.: 502), para diagnostico.
    option tcplog
    option dontlog-normal
    # Espera os primeiros bytes para saber se e HTTP; protocolo binario segue direto.
    tcp-request inspect-delay 5s
    tcp-request content accept if HTTP
    tcp-request content accept if { req.len gt 0 }
    use_backend http_appserver if HTTP
    default_backend tcp_appserver

backend http_appserver
    mode http
    http-reuse never
    use-server approot if { path_beg /app-root } { srv_is_up(http_appserver/approot) }
    use-server appserver unless { path_beg /app-root } { srv_is_up(http_appserver/approot) }
    server appserver 127.0.0.1:1235
    server approot 127.0.0.1:9995 check inter 3s fall 2 rise 1

backend tcp_appserver
    mode tcp
    server appserver 127.0.0.1:1235
