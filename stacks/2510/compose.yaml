# Protheus 12.1.2510 - stack isolada do lab (project plab-2510).
# Imagens e portas vem do .env (ver .env.example). Os nomes postgresql-2510,
# license-server-2510 e dbaccess-2510 sao exigidos pelos .ini das imagens e
# existem aqui apenas como aliases de rede (sem container_name).
name: plab-2510

x-ulimits: &ulimits
  core: {soft: -1, hard: -1}
  nofile: {soft: 65536, hard: 65536}
  stack: {soft: 1048576, hard: 1048576}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: ${PLAB_2510_IMG_DB:?defina PLAB_2510_IMG_DB no .env}
    platform: linux/amd64
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLAB_2510_PORT_DB:-25432}:5432"
    volumes:
      # Na 2510 a base e restaurada na primeira subida (alguns minutos).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -q"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    mem_limit: ${PLAB_MEM_DB:-2g}
    logging: *logging
    networks:
      default:
        aliases: [postgresql-2510]

  license:
    image: ${PLAB_2510_IMG_LICENSE:?defina PLAB_2510_IMG_LICENSE no .env}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLAB_2510_PORT_LICMON:-25020}:8020"
    ulimits: *ulimits
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5555"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: ${PLAB_MEM_LICENSE:-1g}
    logging: *logging
    networks:
      default:
        aliases: [license-server-2510]
      plab:
        # O lab testa a porta no doctor (FR-008).
        aliases: [license-server-2510]

  dbaccess:
    image: ${PLAB_2510_IMG_DBACCESS:?defina PLAB_2510_IMG_DBACCESS no .env}
    platform: linux/amd64
    restart: unless-stopped
    ulimits: *ulimits
    depends_on:
      db: {condition: service_healthy}
      license: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/7890"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${PLAB_MEM_DBACCESS:-1g}
    logging: *logging
    networks:
      default:
        aliases: [dbaccess-2510]
      plab:
        # O lab testa a porta no doctor (FR-008).
        aliases: [dbaccess-2510]

  # Semeia, uma vez, o RPO proprio do ambiente de compilacao P2510D (ver entrypoint-lab.sh).
  # Sentinela .plab-seeded gravada so depois da copia completa (ver stacks/semear-volume.sh).
  rpo-init:
    image: ${PLAB_2510_IMG_APPSERVER:?defina PLAB_2510_IMG_APPSERVER no .env}
    platform: linux/amd64
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        bash /plab/semear-volume.sh /protheus12/apo /dst tttm120.rpo rpo-init
        ls -la /dst
    volumes:
      - rpo-compila:/dst
      - ../semear-volume.sh:/plab/semear-volume.sh:ro
    logging: *logging
    network_mode: none

  appserver:
    image: ${PLAB_2510_IMG_APPSERVER:?defina PLAB_2510_IMG_APPSERVER no .env}
    platform: linux/amd64
    restart: unless-stopped
    # P2510D com RPO proprio: ver stacks/2510/entrypoint-lab.sh.
    entrypoint: ["/bin/bash", "/plab/entrypoint-lab.sh"]
    environment:
      - APPSERVER_DATABASE=POSTGRES
    ports:
      - "127.0.0.1:${PLAB_2510_PORT_TCP:-25234}:1234"
      - "127.0.0.1:${PLAB_2510_PORT_WEBAPP:-25321}:4321"
      - "127.0.0.1:${PLAB_2510_PORT_REST:-25181}:8181"
    volumes:
      # RPO do ambiente P2510 (WebApp/REST), preservado entre recriacoes.
      - apo:/protheus12/apo
      # RPO proprio do ambiente de compilacao P2510D.
      - rpo-compila:/protheus12/apo_compila
      - ./entrypoint-lab.sh:/plab/entrypoint-lab.sh:ro
    ulimits: *ulimits
    depends_on:
      dbaccess: {condition: service_healthy}
      rpo-init: {condition: service_completed_successfully}
    healthcheck:
      # WebApp e tambem a interface nova (/app-root), que pode cair sozinha (ver entrypoint-lab.sh).
      test: ["CMD", "bash", "-c", "curl -sf -o /dev/null -m 5 http://127.0.0.1:4321/ && curl -sf -o /dev/null -m 5 http://127.0.0.1:1234/app-root/"]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 120s
    mem_limit: ${PLAB_MEM_APPSERVER:-6g}
    logging: *logging
    networks:
      default:
        aliases: [appserver]
      plab:
        aliases: [appserver-2510]

volumes:
  pgdata:
  apo:
  rpo-compila:

networks:
  default:
  plab:
    external: true
